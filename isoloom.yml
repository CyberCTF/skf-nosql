# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF NoSQL Injection (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask comment board on MongoDB that passes JSON request values straight into its queries (NoSQL injection). The SKF lab folder python/NoSQL is
# vendored unchanged in build/web/app/ and built by an overlay of its Dockerfile (build/web/Dockerfile).
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-nosql

networks:
  lab: { cidr: 10.60.166.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5000, name: web, http: true, publish: 5050 }]
    resources: { cpus: 1, memory_mb: 768 }
    docker:
      build: build/web

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 180
  - name: the comments API answers from MongoDB
    script: checks/comments.sh

message: |
  OWASP SKF NoSQL Injection answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Login and comments speak JSON to /login/ and /comments/. What else can a JSON value be?
